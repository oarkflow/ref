<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>${title} - ${app_name}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M6 8h12M6 12h8M6 16h5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css?v=${asset_version}">
</head>
<body>
  <div class="shell" id="shell">
    @include("components/header.html")
    <div class="main">
      <header class="topbar">
        <button type="button" class="iconbtn" id="burger" aria-label="Open the menu" data-icon="menu"></button>
        <div class="crumbs"><span>${app_name}</span><span class="faint">/</span><strong id="crumb"></strong></div>
        <div class="grow"></div>
        <button type="button" class="iconbtn" id="bell" aria-label="Notifications" data-icon="bell"><span class="dot" id="bell-count" hidden></span></button>
        <button type="button" class="userchip" id="userchip" aria-label="Account menu"><span class="avatar" id="avatar"></span><span id="who" class="muted"></span></button>
      </header>
      <main class="page" id="main">
        @block("content") {}
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/js/ui.js?v=${asset_version}"></script>
  @block("scripts") {}
</body>
</html>
