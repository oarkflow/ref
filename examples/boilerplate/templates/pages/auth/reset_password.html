@extends("layouts/auth.html")

@define("content") {
  <div class="auth-header">
    <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">🛡️</div>
    <h1>Reset Password</h1>
    <p>Set a new password for your account</p>
  </div>

  <form method="POST" action="/reset-password">
    <div class="form-group">
      <label class="form-label" for="token">Reset Token</label>
      <input type="text" id="token" name="token" class="form-input font-mono" placeholder="Paste your 64-char reset token" value="${token}" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="new_password">New Password</label>
      <input type="password" id="new_password" name="new_password" class="form-input" placeholder="At least 8 chars" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm New Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Repeat new password" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
      Save Password (Argon2id)
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-dim);">
    Remembered your password? <a href="/login">Back to Sign In</a>
  </div>
}
