<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passport Request</title>
<meta name="description" content="Apply for a passport, follow your case, and verify certificates.">
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface-2:#f0f2f5;--text:#1b1f24;--muted:#5b6470;--border:#d7dbe0;
  --accent:#1f5fbf;--accent-text:#fff;--accent-soft:#e6eefb;--ok:#1d7a46;--ok-soft:#e3f4ea;
  --warn:#9a5b00;--warn-soft:#fff3dc;--bad:#b3261e;--bad-soft:#fde8e6;--focus:#1f5fbf;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--surface:#1b1e23;--surface-2:#23272d;--text:#e7e9ec;--muted:#9aa3ad;--border:#343a42;
  --accent:#7aa7f0;--accent-text:#0d1420;--accent-soft:#1d2a40;--ok:#6fcf97;--ok-soft:#18301f;
  --warn:#f0b35a;--warn-soft:#352812;--bad:#f28b82;--bad-soft:#3a1c1a;--focus:#7aa7f0;
  --shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-top:10px;padding-bottom:10px}
.brand{font-weight:700;text-decoration:none;color:var(--text);margin-right:auto}
.top nav{display:flex;gap:12px}
.ident{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.ident input{width:200px;max-width:100%}
.ident small{color:var(--muted)}
main{padding-top:20px;padding-bottom:48px}
main:focus{outline:none}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.15rem;margin:0 0 8px}h3{font-size:1rem;margin:0 0 6px}
p{margin:0 0 8px}.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.cards .card{margin:0}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=datetime-local],input[type=password],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);min-width:0}
textarea{resize:vertical}
button,.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;text-decoration:none;color:var(--text)}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.stack>*+*{margin-top:10px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.b-info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;overflow-wrap:anywhere}
.banner.error{background:var(--bad-soft);color:var(--bad)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner ul{margin:6px 0 0;padding-left:20px}
.progress{display:flex;list-style:none;padding:0;margin:0 0 16px;gap:4px;overflow-x:auto}
.progress li{flex:1 1 0;min-width:90px}
.progress a{display:block;padding:8px 6px 6px;border-top:4px solid var(--border);text-decoration:none;color:var(--muted);font-size:.85rem}
.progress .completed a{border-color:var(--ok);color:var(--text)}
.progress .active a{border-color:var(--accent);color:var(--text);font-weight:600}
.progress .returned a{border-color:var(--warn);color:var(--text);font-weight:600}
.progress .rejected a{border-color:var(--bad)}
.progress .skipped a{border-top-style:dashed}
.progress [aria-current] a{background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:12px 16px}
.field{min-width:0}
.field>label,.field .lbl{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.req{color:var(--bad)}
.help,.note{color:var(--muted);font-size:.82rem;margin-top:3px}
.help:empty{display:none}
.value{padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--border);min-height:38px;overflow-wrap:anywhere}
.field.flagged{border-left:4px solid var(--warn);padding-left:10px}
.flag{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:6px 8px;margin-top:6px;font-size:.88rem}
.err{color:var(--bad);font-size:.85rem;margin-top:4px}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad)}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:500}
.check input{margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:4px 16px}
dl.summary{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 16px;margin:0}
dl.summary dt{color:var(--muted)}dl.summary dd{margin:0;overflow-wrap:anywhere}
.form+.form{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.entry{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;white-space:nowrap}
.tabs button[aria-selected=true]{border-color:var(--accent);font-weight:600}
details.acc{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--surface)}
details.acc>summary{cursor:pointer;padding:10px 12px;font-weight:600}
details.acc>div{padding:0 12px 12px}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 14px;flex-wrap:wrap}
.steps li{font-size:.82rem;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.steps li[aria-current]{background:var(--accent);color:var(--accent-text)}
.steps li.done{color:var(--ok)}
.dot{color:var(--bad);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.node{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.node-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.node-head h3{margin:0;margin-right:auto}
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.rv .rv-c{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg label{padding:4px 10px;cursor:pointer;font-size:.85rem;position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){background:var(--accent-soft);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--focus)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:.82rem;color:var(--muted)}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{padding:6px 0;border-bottom:1px solid var(--border)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.82rem;background:var(--surface-2);padding:8px;border-radius:6px;margin:6px 0 0}
code{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:640px){
  .grid{grid-template-columns:1fr}.grid>*{grid-column:1/-1 !important}
  dl.summary{grid-template-columns:1fr}dl.summary dd{margin-bottom:6px}
  .ident,.ident input{width:100%}.ident input{flex:1 1 100%}
  .rv{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/">Passport Request</a>
  <nav aria-label="Main"><a href="#/">Home</a><a href="#/queue">Cases</a></nav>
  <div class="ident">
    <label for="tok" class="sr">Access token</label>
    <input id="tok" type="password" autocomplete="off" placeholder="Staff / citizen token (optional)">
    <button id="tokSave" type="button">Use token</button><button id="tokClear" type="button">Sign out</button>
    <small id="who" aria-live="polite"></small>
  </div>
</div></header>
<main class="wrap" id="app" tabindex="-1"></main>
<script>
'use strict';
const API = '/api/passport';
const DISTRICTS = [['ktm', 'Kathmandu'], ['lalitpur', 'Lalitpur'], ['morang', 'Morang']];
const app = document.getElementById('app');

// ---------- storage (always guarded) ----------
function load(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
let token = load('passport.token', '') || '';
let keys = load('passport.keys', {}) || {};
function saveKey(id, key) { keys[id] = key; store('passport.keys', keys); }

// ---------- DOM helper: text only, never innerHTML ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (['value', 'checked', 'disabled', 'open'].includes(k)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  return add(el, kids);
}
function add(el, kids) { for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k)); return el; }
const badgeClass = s => ({ passed: 'b-ok', completed: 'b-ok', approved: 'b-ok', verified: 'b-ok', active: 'b-info', in_progress: 'b-info',
  returned: 'b-warn', flagged: 'b-warn', waived: 'b-warn', failed: 'b-bad', rejected: 'b-bad', withdrawn: 'b-bad' }[s] || '');
const badge = (s, label) => h('span', { class: 'badge ' + badgeClass(s) }, label || String(s || '').replace(/_/g, ' '));
const when = t => { if (!t) return ''; const d = new Date(t); return isNaN(d) ? String(t) : d.toLocaleString(); };
const safeId = p => 'f_' + String(p).replace(/[^\w-]/g, '_');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---------- API ----------
async function api(method, path, body, caseId) {
  const headers = { Accept: 'application/json' };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (token) headers.Authorization = 'Bearer ' + token;
  if (caseId && keys[caseId]) headers['X-Access-Key'] = keys[caseId];
  const res = await fetch(API + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let json = null;
  try { json = await res.json(); } catch (e) { /* empty or non-JSON body */ }
  if (!res.ok) {
    // Failures render as {"error": {"code", "message", "details": [{path, rule, message}]}}.
    const e = json && json.error && typeof json.error === 'object' ? json.error : (json || {});
    const msg = e.message || (json && typeof json.error === 'string' ? json.error : '') || (res.status + ' ' + res.statusText);
    const err = new Error(msg); err.status = res.status; err.details = Array.isArray(e.details) ? e.details : [];
    throw err;
  }
  return json;
}

// ---------- identity ----------
function claims() {
  try { const p = token.split('.')[1]; return JSON.parse(atob(p.replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) { return null; }
}
function renderIdent() {
  const c = claims(); const who = document.getElementById('who');
  who.textContent = !token ? 'Anonymous' : c ? 'Signed in as ' + (c.sub || '?') + (c.roles && c.roles.length ? ' (' + [].concat(c.roles).join(', ') + ')' : '') : 'Token set';
  document.getElementById('tokClear').hidden = !token;
}
document.getElementById('tokSave').addEventListener('click', () => {
  const inp = document.getElementById('tok'); token = inp.value.trim(); inp.value = ''; store('passport.token', token || null); renderIdent(); route();
});
document.getElementById('tokClear').addEventListener('click', () => { token = ''; store('passport.token', null); renderIdent(); route(); });

// ---------- state ----------
const S = { view: null, vals: {}, reps: {}, dirty: new Set(), errs: {}, notice: null, flash: null, steps: {}, verdicts: {}, nodeIn: {}, comment: '', busy: false, history: null, key: '' };

function page(...kids) { app.replaceChildren(...kids.flat().filter(Boolean)); }
function notice() {
  const n = S.notice; if (!n) return null;
  return h('div', { class: 'banner ' + n.kind, role: n.kind === 'error' ? 'alert' : 'status' }, n.text,
    n.list && n.list.length ? h('ul', null, n.list.map(t => h('li', null, t))) : null);
}
const errList = list => (list || []).map(m => h('div', { class: 'err', role: 'alert' }, m));

// ---------- router ----------
async function route() {
  const parts = (location.hash.replace(/^#\/?/, '') || '').split('/').map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } });
  S.notice = S.flash; S.flash = null;
  try {
    if (parts[0] === 'case' && parts[1]) await showCase(parts[1], parts[2] || '');
    else if (parts[0] === 'queue') await showQueue(parts[1] || (claims() && !(claims().roles || []).length ? 'mine' : 'queue'));
    else if (parts[0] === 'verify' && parts[1]) await showVerify(parts[1]);
    else showHome();
  } catch (e) {
    page(h('h1', null, 'Something went wrong'), h('div', { class: 'banner error', role: 'alert' }, e.message),
      e.status === 401 || e.status === 403 || e.status === 404 ? h('p', { class: 'muted' }, 'You may need a staff token, or the access key for this case.') : null,
      h('a', { class: 'btn', href: '#/' }, 'Back home'));
  }
  app.focus({ preventScroll: true });
}
window.addEventListener('hashchange', route);

// ---------- home ----------
function showHome() {
  const dist = h('select', { id: 'dist' }, DISTRICTS.map(([v, l]) => h('option', { value: v }, l)));
  const startBtn = h('button', { class: 'primary', type: 'button', onclick: async () => {
    startBtn.disabled = true;
    try {
      const v = await api('POST', '/cases', { org_unit: dist.value });
      if (v.access_key) saveKey(v.case.id, v.access_key);
      S.flash = { kind: 'ok', text: 'Application ' + v.case.number + ' started.' + (v.access_key
        ? ' It is remembered on this device. To come back from elsewhere, note your case ID ' + v.case.id + ' and access key ' + v.access_key + '.' : '') };
      location.hash = '#/case/' + encodeURIComponent(v.case.id);
    } catch (e) { S.notice = { kind: 'error', text: e.message }; showHome(); }
  } }, 'Start application');
  const rid = h('input', { type: 'text', id: 'rid', autocomplete: 'off' }), rkey = h('input', { type: 'text', id: 'rkey', autocomplete: 'off' });
  const vkey = h('input', { type: 'text', id: 'vkey', autocomplete: 'off', placeholder: 'Number or code' });
  const mine = Object.keys(keys);
  page(
    h('h1', null, 'Passport services'), h('p', { class: 'muted' }, 'Apply for a new passport or renew one, follow your application, or check a certificate.'),
    notice(),
    h('div', { class: 'cards' },
      h('section', { class: 'card stack', 'aria-labelledby': 'h-start' }, h('h2', { id: 'h-start' }, 'Start an application'),
        h('div', { class: 'field' }, h('label', { for: 'dist' }, 'Your district'), dist), startBtn),
      h('form', { class: 'card stack', 'aria-labelledby': 'h-res', onsubmit: e => {
        e.preventDefault(); const id = rid.value.trim(); if (!id) return;
        if (rkey.value.trim()) saveKey(id, rkey.value.trim()); location.hash = '#/case/' + encodeURIComponent(id);
      } }, h('h2', { id: 'h-res' }, 'Resume an application'),
        h('div', { class: 'field' }, h('label', { for: 'rid' }, 'Case ID'), rid),
        h('div', { class: 'field' }, h('label', { for: 'rkey' }, 'Access key'), rkey, h('div', { class: 'help' }, 'Not needed when you use a token.')),
        h('button', { type: 'submit' }, 'Open')),
      h('form', { class: 'card stack', 'aria-labelledby': 'h-ver', onsubmit: e => {
        e.preventDefault(); if (vkey.value.trim()) location.hash = '#/verify/' + encodeURIComponent(vkey.value.trim());
      } }, h('h2', { id: 'h-ver' }, 'Verify a certificate'),
        h('div', { class: 'field' }, h('label', { for: 'vkey' }, 'Certificate number or verification code'), vkey),
        h('button', { type: 'submit' }, 'Verify'))),
    mine.length ? h('section', { class: 'card', style: 'margin-top:16px' }, h('h2', null, 'Applications on this device'),
      h('ul', null, mine.map(id => h('li', null, h('a', { href: '#/case/' + encodeURIComponent(id) }, id), ' ',
        h('button', { type: 'button', onclick: () => { delete keys[id]; store('passport.keys', keys); showHome(); } }, 'Forget'))))) : null);
}

// ---------- case ----------
async function showCase(id, stage) {
  page(h('p', { class: 'muted' }, 'Loading…'));
  const v = await api('GET', '/cases/' + encodeURIComponent(id) + (stage ? '/stages/' + encodeURIComponent(stage) : ''), undefined, id);
  S.history = null; S.errs = {};
  applyView(v);
  renderCase();
}

function forEachInput(fn) {
  for (const g of (S.view.page && S.view.page.groups) || []) for (const f of g.forms || []) for (const inp of f.inputs || []) fn(inp, f, g);
}
function applyView(v) {
  const key = v.case.id + '/' + (v.stage && v.stage.name);
  if (key !== S.key) { S.steps = {}; S.key = key; }
  S.view = v; S.vals = {}; S.reps = {}; S.dirty = new Set(); S.verdicts = {}; S.nodeIn = {}; S.comment = '';
  if (!v.stage) return;
  const seen = {};
  forEachInput((inp, f) => {
    // A form shown in several groups keeps its editable rendering's value.
    if (!seen[inp.path] || inp.editable) { S.vals[inp.path] = inp.value; seen[inp.path] = true; }
    if (f.repeatable && !S.reps[f.name]) S.reps[f.name] = (f.entries || []).map(e => Object.assign({}, e));
    if (inp.verdict) for (const n of v.nodes || []) if ((n.forms || []).includes(f.name)) {
      (S.verdicts[n.name] = S.verdicts[n.name] || {})[inp.path] = { status: inp.verdict.status, comment: inp.verdict.comment || '' };
    }
  });
}

function display(val, inp) {
  if (val == null || val === '' || (Array.isArray(val) && !val.length)) return '—';
  if (typeof val === 'boolean') return val ? 'Yes' : 'No';
  const label = x => { const c = inp && (inp.choices || []).find(o => String(o.value) === String(x)); return c ? (c.label || String(c.value)) : String(x); };
  if (Array.isArray(val)) return val.map(label).join(', ');
  if (typeof val === 'object') return String(val.name || val.id || JSON.stringify(val));
  if (inp && inp.kind === 'datetime') return when(val);
  return label(val);
}
function toLocal(iso) {
  const d = new Date(iso); if (!iso || isNaN(d)) return ''; const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function control(inp, path, val, set) {
  const id = safeId(path), desc = id + '_d';
  const base = { id, name: path, 'aria-describedby': desc, 'aria-required': inp.required ? 'true' : null, placeholder: inp.placeholder || null,
    'aria-invalid': S.errs[path] ? 'true' : null };
  const choices = inp.choices && inp.choices.length ? inp.choices : (inp.options || []).map(o => ({ value: o, label: o }));
  const str = val == null ? '' : String(val);
  switch (inp.kind) {
    case 'textarea': return h('textarea', { ...base, rows: 3, maxlength: inp.max_length || null, value: str, oninput: e => set(e.target.value) });
    case 'boolean': return h('input', { ...base, type: 'checkbox', checked: val === true, onchange: e => set(e.target.checked ? true : (inp.required ? null : false)) });
    case 'number': case 'integer': return h('input', { ...base, type: 'number', step: inp.kind === 'integer' ? '1' : 'any', min: inp.min || null, max: inp.max || null,
      value: str, oninput: e => set(e.target.value === '' ? null : Number(e.target.value)) });
    case 'date': return h('input', { ...base, type: 'date', min: inp.min || null, max: inp.max || null, value: str.slice(0, 10), onchange: e => set(e.target.value || null) });
    case 'datetime': return h('input', { ...base, type: 'datetime-local', value: toLocal(val), onchange: e => set(e.target.value ? new Date(e.target.value).toISOString() : null) });
    case 'select': return h('select', { ...base, placeholder: null, onchange: e => set(e.target.value || null) }, h('option', { value: '' }, inp.placeholder || 'Choose…'),
      choices.map(c => { const o = h('option', { value: String(c.value) }, c.label || String(c.value)); o.selected = String(c.value) === str; return o; }));
    case 'radio': case 'multiselect': {
      const multi = inp.kind === 'multiselect', cur = multi ? [].concat(val || []).map(String) : [];

    any = true;
    if (f.repeatable) {
      data[f.name] = (S.reps[f.name] || []).map(e => { const o = {}; for (const i of f.inputs) if (i.editable && e[i.name] !== undefined) o[i.name] = e[i.name]; return o; });
      return;

// ---------- queue ----------
async function showQueue(scope) {
  const sw = h('div', { class: 'row', role: 'group', 'aria-label': 'Scope' }, ['mine', 'queue', 'all'].map(s =>
    h('a', { class: 'btn' + (s === scope ? ' primary' : ''), href: '#/queue/' + s, 'aria-current': s === scope ? 'page' : null }, { mine: 'My cases', queue: 'Work queue', all: 'All' }[s])));
  if (!token) { page(h('h1', null, 'Cases'), sw, h('div', { class: 'banner warn', style: 'margin-top:16px' }, 'Paste a staff or citizen token in the header to list cases.')); return; }
  page(h('h1', null, 'Cases'), sw, h('p', { class: 'muted' }, 'Loading…'));
  const rows = await api('GET', '/cases?scope=' + encodeURIComponent(scope));
  const nodesText = x => Array.isArray(x) ? (x.length ? x.map(n => typeof n === 'object' && n ? (n.title || n.name) : n).join(', ') : '—') : (x == null ? '—' : String(x));
  page(h('h1', null, 'Cases'), sw, notice(), h('div', { class: 'card', style: 'margin-top:16px' },
    !rows || !rows.length ? h('p', { class: 'muted' }, 'No cases.') : h('div', { class: 'tbl-wrap' }, h('table', null,
      h('thead', null, h('tr', null, ['Number', 'Stage', 'Stage status', 'Case status', 'Due', 'Open tasks'].map(t => h('th', { scope: 'col' }, t)))),
      h('tbody', null, rows.map(r => h('tr', null,
        h('td', null, h('a', { href: '#/case/' + encodeURIComponent(r.id) }, r.number || r.id)),
        h('td', null, r.stage_title || r.stage), h('td', null, r.stage_status ? badge(r.stage_status) : '—'), h('td', null, badge(r.status)),
        h('td', null, r.due_at ? when(r.due_at) : '—', r.overdue ? [' ', badge('failed', 'overdue')] : null),
        h('td', null, nodesText(r.open_nodes)))))))));
}

// ---------- verify ----------
async function showVerify(key) {
  page(h('p', { class: 'muted' }, 'Checking…'));
  const r = await api('GET', '/certificates/' + encodeURIComponent(key));
  const ct = r.certificate || {};
  page(h('h1', null, 'Certificate check'),
    h('div', { class: 'banner ' + (r.valid ? 'ok' : 'error'), role: 'status' }, h('strong', null, r.valid ? 'Valid certificate' : 'Not valid'), r.reason ? ' — ' + r.reason : ''),
    r.certificate ? h('section', { class: 'card' }, h('h2', null, (ct.title || 'Certificate') + ' ' + (ct.number || '')),
      h('dl', { class: 'summary' },
        [['Verification code', ct.code], ['Case', ct.case_number], ['Issued', when(ct.issued_at)], ['Expires', when(ct.expires_at)]]
          .map(([k, val]) => [h('dt', null, k), h('dd', null, val || '—')]),
        Object.entries(ct.subject || {}).map(([k, val]) => [h('dt', null, k), h('dd', null, display(val))]))) : null,
    h('a', { class: 'btn', href: '#/' }, 'Check another'));
}

renderIdent();
route();
</script>
