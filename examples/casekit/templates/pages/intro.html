@extends("layouts/base.html")

@define("content") {
  <div class="card stack">
    <h1>${intro.title}</h1>
    @if(intro.image != "") {
      <img class="intro-img" src="${intro.image}" alt="${intro.image_alt}">
    }
    @if(intro.content != "") {
      <iframe class="intro-html" sandbox="" title="About this workflow" srcdoc="<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;color:#1d2330}</style>${intro.content}"></iframe>
    }
    @if(length(intro.documents) > 0) {
      <div>
        <h3>Read before you start</h3>
        <ul>
          @for(d in intro.documents) {
            <li><a href="${d.url}" target="_blank" rel="noopener">${d.title}</a></li>
          }
        </ul>
      </div>
    }
    <div class="row">
      <button type="button" class="primary big" data-start="${name}">${intro.button}</button>
      <a class="btn" href="/">Back</a>
    </div>
  </div>
}
