<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realtime Platform</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --mine:#dbeafe; --panel:#f8fafc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e6e8eb; --muted:#9aa3af; --line:#272b33; --accent:#60a5fa; --mine:#1e3a5f; --panel:#161a20; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:.75rem; padding:.6rem 1rem; border-bottom:1px solid var(--line); }
  header h1 { font-size:1rem; margin:0; flex:1; }
  .dot { width:.6rem; height:.6rem; border-radius:50%; background:#9ca3af; display:inline-block; }
  .dot.on { background:#22c55e; }
  main { flex:1; display:flex; min-height:0; }
  aside { width:260px; border-right:1px solid var(--line); background:var(--panel); overflow:auto; padding:.5rem; }
  aside h2 { font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:.75rem .5rem .25rem; }
  .item { display:flex; justify-content:space-between; gap:.5rem; width:100%; text-align:left; padding:.45rem .6rem; border:0; background:none; color:inherit; border-radius:.4rem; font:inherit; cursor:pointer; }
  .item:hover, .item.sel { background:var(--line); }
  .badge { background:var(--accent); color:#fff; border-radius:1rem; padding:0 .45rem; font-size:.75rem; }
  section { flex:1; display:flex; flex-direction:column; min-width:0; }
  #msgs { flex:1; overflow:auto; padding:1rem; display:flex; flex-direction:column; gap:.4rem; }
  .m { max-width:70%; padding:.4rem .7rem; border-radius:.7rem; background:var(--panel); border:1px solid var(--line); overflow-wrap:anywhere; white-space:pre-wrap; }
  .m.me { align-self:flex-end; background:var(--mine); }
  .m small { display:block; color:var(--muted); font-size:.72rem; }
  #bar { padding:.25rem 1rem; color:var(--muted); min-height:1.6rem; font-size:.85rem; }
  form.send { display:flex; gap:.5rem; padding:.6rem 1rem; border-top:1px solid var(--line); }
  input, button.btn { font:inherit; padding:.5rem .7rem; border-radius:.4rem; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  form.send input { flex:1; }
  button.btn { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  button.btn.alt { background:var(--bg); color:var(--fg); border-color:var(--line); }
  #login { margin:auto; display:flex; flex-direction:column; gap:.6rem; width:min(320px, 90vw); }
  #call { display:none; position:fixed; right:1rem; bottom:1rem; background:var(--panel); border:1px solid var(--line); border-radius:.6rem; padding:.6rem; width:min(520px, 94vw); }
  #call video { width:100%; border-radius:.4rem; background:#000; }
  #tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:.4rem; margin-top:.4rem; }
  #net { font-size:.75rem; color:var(--muted); margin-top:.3rem; }
  #sec { font-size:.78rem; margin:.3rem 0; } #lock { font-weight:600; } #lock.ok { color:#16a34a; } #lock.no { color:#d97706; }
  #warn { color:#dc2626; font-weight:600; } #seen { white-space:pre-wrap; word-break:break-all; background:var(--bg); border:1px solid var(--line); border-radius:.4rem; padding:.4rem; font-size:.7rem; max-height:8rem; overflow:auto; }
  #tiles figure { margin:0; position:relative; cursor:pointer; border-radius:.4rem; } #tiles figure.speaking { outline:3px solid #22c55e; }
  #tiles figure { margin:0; position:relative; cursor:pointer; } #tiles figure.pinned { grid-column:span 2; } #tiles figcaption { position:absolute; left:.4rem; bottom:.3rem; color:#fff; font-size:.75rem; text-shadow:0 0 3px #000; }
  #call .row { display:flex; gap:.5rem; align-items:center; }
  .hidden { display:none !important; }
  @media (max-width: 640px) { aside { width:100px; } .m { max-width:92%; } }
</style>
</head>
<body>
<header>
  <h1>Realtime Platform <span class="dot" id="conn" title="connection"></span></h1>
  <span id="who"></span>
  <a class="item" style="width:auto" href="#" id="export">Export CSV</a>
</header>

<div id="login">
  <strong>Demo sign in</strong>
  <select id="user" class="btn alt"><option>ada</option><option>bob</option><option>cy</option></select>
  <input id="pw" type="password" placeholder="demo password" autocomplete="current-password">
  <button class="btn" id="go">Sign in</button>
  <span id="err" style="color:#dc2626"></span>
</div>

<main class="hidden" id="app">
  <aside>
    <h2>Direct messages</h2><div id="people"></div>
    <h2>Channels</h2><div id="chans"></div>
    <button class="item" id="newch">+ New channel</button>
  </aside>
  <section>
    <div id="title" style="padding:.6rem 1rem;border-bottom:1px solid var(--line);display:flex;gap:.5rem;align-items:center">
      <strong id="ctitle">Pick a conversation</strong><span id="online" style="color:var(--muted);flex:1"></span>
      <button class="btn alt hidden" id="callbtn">Video call</button>
      <select id="codec" class="btn alt hidden" title="Video codec for a group call">
        <option value="vp8">VP8 · simulcast</option><option value="h264">H.264 · simulcast</option><option value="vp9">VP9 · SVC</option></select>
      <button class="btn alt hidden" id="groupbtn">Group call</button>
    </div>
    <div id="msgs"></div>
    <div id="bar"></div>
    <form class="send" id="form"><input id="text" placeholder="Message" autocomplete="off" maxlength="2000" disabled><button class="btn" disabled>Send</button></form>
  </section>
</main>

<div id="call">
  <div class="row"><strong id="cstate" style="flex:1"></strong>
    <span id="rec" class="hidden" style="color:#dc2626;font-weight:600;font-size:.8rem">● REC</span>
    <button class="btn alt hidden" id="recbtn" style="font-size:.8rem;padding:.25rem .5rem">Record</button>
    <label id="saverlbl" class="hidden" style="font-size:.8rem"><input type="checkbox" id="saver"> data saver</label>
    <button class="btn" id="accept">Accept</button><button class="btn alt" id="decline">Decline</button><button class="btn alt" id="hangup">Hang up</button></div>
  <div id="sec" class="hidden"><div id="lock"></div><div id="warn"></div>
    <div id="secact" class="hidden"><button class="btn alt" id="seeserver" style="font-size:.75rem;padding:.2rem .5rem">What can the server see?</button></div><pre id="seen" class="hidden"></pre></div>
  <div id="net" class="hidden"></div>
  <div id="tiles"></div>
  <video id="local" autoplay playsinline muted style="width:35%"></video>
</div>

<script src="/e2ee-core.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const PEOPLE = ["ada", "bob", "cy"];
let me = "", ws = null, chans = [], cur = null, online = {}, typing = {}, lastTyped = 0, call = null;

async function api(path, body, method) {
  const r = await fetch(path, { method: method || (body === undefined ? "GET" : "POST"), credentials: "same-origin",
    headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error((j.error && (j.error.message || j.error.code)) || r.status); e.code = j.error && j.error.code; e.status = r.status; throw e; }
  return j;
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const chanName = c => c.kind === "dm" ? (c.members || []).find(m => m !== me) || "direct message" : c.name;

$("go").onclick = async () => {
  $("err").textContent = "";
  try { await api("/api/login", { user: $("user").value, password: $("pw").value }); me = $("user").value; start(); }
  catch (e) { $("err").textContent = e.message; }
};

async function start() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("who").textContent = me;
  connect(); connectCalls();
  const people = $("people"); people.replaceChildren();
  PEOPLE.filter(p => p !== me).forEach(p => {
    const b = el("button", "item", p); b.onclick = async () => { const c = await api("/api/dm", { user: p }); await refresh(c.id); }; people.append(b);
  });
  await refresh();
}

async function refresh(open) {
  chans = (await api("/api/channels")).channels;
  for (const c of chans) { c.members = (await api("/api/members", { channel: c.id })).members; subscribe(c.id); }
  const list = $("chans"); list.replaceChildren();
  chans.filter(c => c.kind !== "dm").forEach(c => list.append(row(c)));
  const people = $("people");
  [...people.children].forEach(b => { b.querySelector(".badge")?.remove();
    const dm = chans.find(c => c.kind === "dm" && (c.members || []).includes(b.firstChild.textContent));
    if (dm && dm.unread) b.append(el("span", "badge", dm.unread));
    b.classList.toggle("sel", !!dm && cur === dm.id); b.onclick = async () => { const c = await api("/api/dm", { user: b.firstChild.textContent }); await refresh(c.id); }; });
  if (open) await openChan(open);
}
function row(c) {
  const b = el("button", "item" + (cur === c.id ? " sel" : ""), chanName(c));
  if (c.unread) b.append(el("span", "badge", c.unread));
  b.onclick = () => openChan(c.id); return b;
}

async function openChan(id) {
  cur = id; const c = chans.find(x => x.id === id);
  $("ctitle").textContent = chanName(c); $("callbtn").classList.toggle("hidden", c.kind !== "dm"); $("groupbtn").classList.toggle("hidden", c.kind === "dm"); $("codec").classList.toggle("hidden", c.kind === "dm");
  $("text").disabled = false; $("form").querySelector("button").disabled = false;
  $("msgs").replaceChildren();
  (await api("/api/history", { channel: id, limit: 100 })).messages.forEach(add);
  await api("/api/read", { channel: id }).catch(() => {});
  c.unread = 0; showOnline(); await refreshList();
}
async function refreshList() {
  const fresh = (await api("/api/channels")).channels;
  fresh.forEach(f => { const o = chans.find(c => c.id === f.id); if (o) o.unread = f.unread; });
  const list = $("chans"); list.replaceChildren(); chans.filter(c => c.kind !== "dm").forEach(c => list.append(row(c)));
  [...$("people").children].forEach(b => { b.querySelector(".badge")?.remove();
    const dm = chans.find(c => c.kind === "dm" && (c.members || []).includes(b.firstChild.textContent));
    if (dm && dm.unread) b.append(el("span", "badge", dm.unread)); b.classList.toggle("sel", !!dm && cur === dm.id); });
}
function add(m) {
  const d = el("div", "m" + (m.sender === me ? " me" : "")); d.append(el("small", "", m.sender + " · " + new Date(m.created_at).toLocaleTimeString()));
  d.append(document.createTextNode(m.body)); const box = $("msgs"); box.append(d); box.scrollTop = box.scrollHeight;
}

$("form").onsubmit = async e => {
  e.preventDefault(); const body = $("text").value.trim(); if (!body || !cur) return; $("text").value = "";
  try { await api("/api/send", { channel: cur, body }); } catch (err) { $("bar").textContent = err.message; }
};
$("text").oninput = () => { if (cur && Date.now() - lastTyped > 2000) { lastTyped = Date.now(); api("/api/typing", { channel: cur }).catch(() => {}); } };
$("newch").onclick = async () => { const name = prompt("Channel name"); if (!name) return;
  const members = (prompt("Members (comma separated)", PEOPLE.filter(p => p !== me).join(",")) || "").split(",").map(s => s.trim()).filter(Boolean);
  const c = await api("/api/channels", { name, members }); await refresh(c.id); };
$("export").onclick = async e => { e.preventDefault(); if (!cur) return;
  const r = await fetch("/api/export", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ channel: cur, format: "csv" }) });
  const a = el("a"); a.href = URL.createObjectURL(await r.blob()); a.download = "chat-export.csv"; a.click(); };

// ---- realtime ------------------------------------------------------------
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/realtime/ws");
  ws.onopen = () => { $("conn").classList.add("on"); chans.forEach(c => subscribe(c.id)); };
  ws.onclose = () => { $("conn").classList.remove("on"); setTimeout(() => me && connect(), 1500); };
  ws.onmessage = ev => { let f; try { f = JSON.parse(ev.data); } catch { return; } frame(f); };
}
function subscribe(id) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: "subscribe", topic: "chat:" + id, track: true })); }
function frame(f) {
  if (f.type === "reply" && f.present) return setOnline(f);
  if (f.type === "presence") { const id = f.topic.slice(5); online[id] = online[id] || new Set(); f.action === "join" ? online[id].add(f.user) : online[id].delete(f.user); showOnline(); return; }
  if (f.type !== "message") return;
  const d = f.data ? JSON.parse(typeof f.data === "string" ? f.data : JSON.stringify(f.data)) : {};
  if (f.topic.startsWith("chat:")) {
    const id = f.topic.slice(5);
    if (f.event === "message") { if (id === cur) { add(d); api("/api/read", { channel: id }).catch(() => {}); } refreshList(); }
    else if (f.event === "typing" && id === cur && d.user !== me) { typing[d.user] = Date.now(); showTyping(); setTimeout(showTyping, 3200); }
    else if (f.event === "receipt" && id === cur && d.user !== me) { $("bar").textContent = d.user + " read up to #" + d.seq; }
    else if (f.event.startsWith("member.")) refresh(cur);
  }
}

// ---- the call service ------------------------------------------------------------
// Calls are not run by this application but by a separate call service (rtcd).
// This application only signs the user in and hands them a short-lived token. The
// browser then keeps ONE WebSocket to the call service and does everything over
// it: starting and answering calls, group calls, key exchange and media
// signaling go out as requests, and the service's events come back on it.
const rtcd = { url: "", token: "", exp: 0, ws: null, pending: new Map(), seq: 0, ping: 0, refresh: 0 };
async function rtcdToken() {
  if (rtcd.token && Date.now() < rtcd.exp - 60000) return rtcd.token;
  const r = await api("/api/call/token", {});
  rtcd.token = r.token; rtcd.url = r.url; rtcd.exp = Date.parse(r.expires_at);
  return rtcd.token;
}
// rtcdApi(op, body) sends a request and resolves with the answer. An error is the service's code, e.g. "e2ee_required".
async function rtcdApi(op, body) {
  const deadline = Date.now() + 8000;
  while (!rtcd.ws || rtcd.ws.readyState !== 1) {   // the socket is being (re)connected
    if (Date.now() > deadline) throw new Error("not_connected");
    await sleep(100);
  }
  const id = String(++rtcd.seq);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { rtcd.pending.delete(id); reject(new Error("timeout")); }, 20000);
    rtcd.pending.set(id, { resolve, reject, timer });
    rtcd.ws.send(JSON.stringify({ type: "emit", id, event: op, payload: body || {} }));
  });
}
function rtcdSettle(f) {
  const p = rtcd.pending.get(f.replyTo); if (!p) return;
  rtcd.pending.delete(f.replyTo); clearTimeout(p.timer);
  if (f.type === "error") {
    // Same shape as any failed request: code says why; status is the HTTP status a plain request would have had.
    const code = String(f.error || "error").split(": ")[0], e = new Error(code);
    e.code = code; e.status = { forbidden: 403, scope_missing: 403, unauthenticated: 401, token_expired: 401, call_ended: 410, not_found: 404, rate_limited: 429, room_full: 429,
      invalid: 400, e2ee_required: 400, bad_preferences: 400 }[code] || (["negotiating", "not_in_room", "answer_the_call_first", "call_not_active", "no_offer_outstanding"].includes(code) ? 409 : 503);
    p.reject(e);
  } else p.resolve(f.payload === undefined ? {} : f.payload);
}
async function connectCalls() {
  try { await rtcdToken(); } catch { return setTimeout(() => me && connectCalls(), 3000); }
  const u = new URL(rtcd.url);
  const s = new WebSocket((u.protocol === "https:" ? "wss://" : "ws://") + u.host + "/v1/ws?token=" + encodeURIComponent(rtcd.token));
  rtcd.ws = s;
  // The service closes a silent connection, so say something now and then; and keep the token fresh without reconnecting.
  s.onopen = () => {
    clearInterval(rtcd.ping); rtcd.ping = setInterval(() => { if (s.readyState === 1) s.send('{"type":"ping"}'); }, 25000);
    clearInterval(rtcd.refresh); rtcd.refresh = setInterval(async () => {
      try { rtcd.token = ""; await rtcdToken(); await rtcdApi("auth.refresh", { token: rtcd.token }); } catch {}
    }, 5 * 60 * 1000);
    // Events were missed while this was down: ask for any offer we never saw.
    if (call && call.mode === "sfu" && call.joined) sfu("resync").catch(() => {});
  };
  s.onclose = () => {
    if (rtcd.ws === s) rtcd.ws = null;
    clearInterval(rtcd.ping); clearInterval(rtcd.refresh);
    for (const [id, p] of rtcd.pending) { clearTimeout(p.timer); p.reject(new Error("not_connected")); rtcd.pending.delete(id); }
    setTimeout(() => me && connectCalls(), 1500);
  };
  s.onmessage = ev => {
    let f; try { f = JSON.parse(ev.data); } catch { return; }
    if (f.type === "ack" || f.type === "error") return rtcdSettle(f);
    if (f.type === "emit" && f.event && f.event !== "ready") callEvent(f.event, f.payload || {});
  };
}
function setOnline(f) { const id = (f.topic || "").slice(5); online[id] = new Set((f.present || []).map(p => p.user)); showOnline(); }
function showOnline() { const s = online[cur]; $("online").textContent = s && s.size ? "online: " + [...s].join(", ") : ""; }
function showTyping() { const who = Object.keys(typing).filter(u => Date.now() - typing[u] < 3000); $("bar").textContent = who.length ? who.join(", ") + " typing…" : ""; }

// ---- end-to-end encryption -------------------------------------------------------
// Every call on this server is end-to-end encrypted. A p2p call is encrypted
// between the two browsers by DTLS-SRTP, and here each side also SIGNS the
// certificate fingerprints it sends, so the server cannot slip itself in. A
// group call goes through the SFU, which would normally decrypt it; instead each
// browser encrypts every frame itself (in a worker) with keys only the people in
// the call have. The server relays the key messages but cannot read, alter or
// forge them. If this browser cannot do it, the call is refused: it never falls
// back to sending media the server could read.
const idb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open("rtc-e2ee", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
};
// Pinned identities: the first key seen for a person is remembered, and a different one later is refused.
const pins = {
  get: async user => { try { return (JSON.parse(localStorage.getItem("rtc.pins:" + me) || "{}"))[user]; } catch { return undefined; } },
  set: async (user, fp) => { try { const m = JSON.parse(localStorage.getItem("rtc.pins:" + me) || "{}"); m[user] = fp; localStorage.setItem("rtc.pins:" + me, JSON.stringify(m)); } catch {} },
};
const e2eeSupported = () => typeof RTCRtpScriptTransform !== "undefined" && !!(window.crypto && crypto.subtle) && typeof E2EE !== "undefined";
let e2e = null;   // the encrypted-call context, while a call is on

function secUI(text, ok) { $("sec").classList.toggle("hidden", !text); $("lock").textContent = text || ""; $("lock").className = ok ? "ok" : "no"; }
function secWarn(text) { $("warn").textContent = text || ""; }

async function e2eeInit(group) {
  if (!e2eeSupported()) throw new Error("This browser cannot do end-to-end encrypted calls (it needs RTCRtpScriptTransform and WebCrypto).");
  if (e2e && e2e.call === call.id) return e2e;
  const identity = await E2EE.Identity.load(me, idb);
  e2e = { call: call.id, identity, group, worker: null, session: null, peers: [], timer: 0, lastWarn: "" };
  if (group) {
    e2e.worker = new Worker("/e2ee-worker.js");
    e2e.worker.postMessage({ type: "self", id: me });
    e2e.worker.onmessage = ev => {
      const m = ev.data;
      if (m.type === "stats") { e2e.stats = m; }
      else if (m.type === "need" && e2e.session) e2e.session.hello(m.user).catch(() => {});
    };
  }
  return e2e;
}

// The group-call key exchange. The worker holds the keys that encrypt and decrypt; the page holds none of them.
async function e2eeStart() {
  if (!e2e || !e2e.group || e2e.session) return;
  e2e.session = new E2EE.Session({
    callId: call.id, identity: e2e.identity, pins,
    send: (to, text) => rtcdApi("call.e2ee", { call: call.id, to, data: text }),
    onKey: async (who, kid, secret) => {
      if (who === null) e2e.worker.postMessage({ type: "own", kid, secret });
      else if (secret === null) e2e.worker.postMessage({ type: "drop", user: who });
      else e2e.worker.postMessage({ type: "peer", user: who, kid, secret });
      e2eeRefresh();
    },
    onWarning: w => { if (w.type === "identity-changed") secWarn("⚠ " + w.user + "'s identity key has CHANGED since you last called them. Their video and audio are blocked until you verify them in person."); },
  });
  await e2e.session.start(await e2eeMembers());
  e2eeRefresh();
}
async function e2eeMembers() {
  const c = await rtcdApi("call.get", { call: call.id });
  return c.participants.filter(p => p.state === "joined").map(p => p.user);
}
// Anyone joining or leaving: every member makes and sends a fresh key, so a leaver
// cannot read what follows and a newcomer cannot read what came before.
function e2eeMembership() {
  if (!e2e || !e2e.session) return;
  clearTimeout(e2e.timer);
  e2e.timer = setTimeout(async () => { try { await e2e.session.membersChanged(await e2eeMembers()); } catch {} e2eeRefresh(); }, 250);
}
async function e2eeRefresh() {
  if (!e2e) return;
  let code = "";
  try { code = e2e.session ? await e2e.session.safetyCode() : await E2EE.safetyCode([{ userId: me, pub: e2e.identity.raw }]); } catch {}
  const stats = e2e.stats ? " · " + e2e.stats.encrypted + " frames sent encrypted, " + e2e.stats.decrypted + " received" + (e2e.stats.dropped ? ", " + e2e.stats.dropped + " refused" : "") : "";
  secUI("🔒 End-to-end encrypted. The server cannot see or hear this call. Safety code: " + code + stats, true);
  $("secact").classList.toggle("hidden", !(call && call.mode === "sfu"));
  if (e2e.session) { const bad = e2e.session.untrusted(); if (bad.length && !$("warn").textContent) secWarn("⚠ Not trusting: " + bad.join(", ")); }
}
// Put the frame encryption on a sender or a receiver.
const e2eeSend = (sender, kind) => { if (e2e && e2e.group) sender.transform = new RTCRtpScriptTransform(e2e.worker, { op: "encrypt", kind }); };
const e2eeRecv = (receiver, kind, sender) => { if (e2e && e2e.group) receiver.transform = new RTCRtpScriptTransform(e2e.worker, { op: "decrypt", kind, sender }); };
// The encoder tells the worker which payload type is which codec, so it knows how much of a frame to leave readable.
function e2eePT(pc) {
  if (!e2e || !e2e.group) return;
  const map = {};
  for (const x of [...pc.getSenders(), ...pc.getReceivers()]) { try { for (const c of x.getParameters().codecs || []) map[c.payloadType] = c.mimeType; } catch {} }
  e2e.worker.postMessage({ type: "pt", map });
}
function e2eeStop() { if (!e2e) return; clearTimeout(e2e.timer); if (e2e.worker) e2e.worker.terminate(); e2e = null; secUI(null); secWarn(""); $("seen").classList.add("hidden"); }
$("seeserver").onclick = async () => {
  try {
    const r = await sfu("sample");
    $("seen").textContent = "Your own media as the server holds it (first bytes of a recent packet):\n" + Object.entries(r.sample).map(([k, v]) => k + ": " + v.match(/.{1,2}/g).join(" ")).join("\n") + "\n\nIn an encrypted call everything after the first few bytes is ciphertext.";
    $("seen").classList.toggle("hidden");
  } catch (e) { $("seen").textContent = e.message; $("seen").classList.remove("hidden"); }
};

// p2p: sign what we send and verify what we get.
async function e2eeSign(sdp) { return e2e && call.e2ee ? await E2EE.signSDP(e2e.identity, call.id, sdp) : undefined; }
async function e2eeVerify(sdp, proof) {
  if (!call.e2ee) return;
  const idRaw = await E2EE.verifySDP(call.peer, call.id, sdp, proof, pins);
  e2e.peers = [{ userId: call.peer, pub: idRaw }];
  const code = await E2EE.safetyCode([{ userId: me, pub: e2e.identity.raw }, { userId: call.peer, pub: idRaw }]);
  secUI("🔒 End-to-end encrypted with " + call.peer + ". Safety code: " + code, true);
}
function e2eeFail(err) {
  secUI(null); netNote("call refused: " + (err && err.message || err));
  if (call) { const id = call.id; hangup(true); rtcdApi("call.end", { call: id }).catch(() => {}); }
  alert && 0;
}

// ---- calls ----------------------------------------------------------------
// Two kinds. p2p: two browsers talk directly and the server only relays their
// signaling. Group: every browser sends ONE video as three layers (q, h, f) to
// the server, which sends each viewer the layer their screen and network can
// use, and everyone sees everyone.
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pcCfg = ice => ({ iceServers: (ice || []).map(s => ({ urls: s.urls, username: s.username, credential: s.credential })) });
function callUI(state, ringing) { $("call").style.display = state ? "block" : "none"; $("cstate").textContent = state || "";
  $("accept").classList.toggle("hidden", !ringing); $("decline").classList.toggle("hidden", !ringing); $("hangup").classList.toggle("hidden", ringing);
  $("recbtn").classList.toggle("hidden", !(call && call.mode === "sfu" && !ringing && call.initiator === me));
  $("saverlbl").classList.toggle("hidden", !(call && call.mode === "sfu" && !ringing)); $("net").classList.toggle("hidden", !(call && call.mode === "sfu" && !ringing)); }
async function media() { const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true },
  video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } } }); $("local").srcObject = s; return s; }

// One tile per remote stream. In a group call the server names each stream after
// the user who publishes it, so the label cannot be forged by the publisher.
function addTile(stream) {
  if (!stream || document.getElementById("t-" + stream.id)) return;
  const fig = el("figure"); fig.id = "t-" + stream.id; fig.dataset.user = stream.id;
  const v = el("video"); v.autoplay = true; v.playsInline = true; v.srcObject = stream;
  fig.append(v, el("figcaption", "", stream.id)); $("tiles").append(fig);
  stream.onremovetrack = () => { if (!stream.getTracks().length) { fig.remove(); sendPrefs(); } };
  fig.onclick = () => { call.pinned = call.pinned === stream.id ? "" : stream.id; markPinned(); sendPrefs(); };
  if (window.IntersectionObserver) visObserver.observe(fig);
  if (window.ResizeObserver) sizeObserver.observe(fig);
  sendPrefs();
}
function markSpeaker(user) { document.querySelectorAll("#tiles figure").forEach(f => f.classList.toggle("speaking", !!user && f.dataset.user === user)); }
// Everyone in a call that is being recorded is told, and sees it.
function showRecording(on, by) { $("rec").classList.toggle("hidden", !on); $("rec").title = on ? "Recorded; started by " + by : "";
  $("recbtn").textContent = on ? "Stop recording" : "Record"; if (call) call.recording = on; }
$("recbtn").onclick = async () => { if (!call) return; try { await sfu(call.recording ? "record/stop" : "record/start"); } catch (e) { netNote("recording: " + e.message); } };
function markPinned() { document.querySelectorAll("#tiles figure").forEach(f => f.classList.toggle("pinned", !!call && f.dataset.user === call.pinned)); }

// Tell the server how big each tile is and which are on screen, so a thumbnail
// gets the small layer and a hidden tile gets nothing. Nobody is hidden by
// default: a tile is only paused when it is genuinely not visible.
const visible = new Map();
const visObserver = window.IntersectionObserver ? new IntersectionObserver(es => { es.forEach(e => visible.set(e.target.dataset.user, e.isIntersecting)); sendPrefs(); }) : null;
const sizeObserver = window.ResizeObserver ? new ResizeObserver(() => sendPrefs()) : null;
document.addEventListener("visibilitychange", () => sendPrefs());
$("saver").onchange = () => sendPrefs();
let prefsTimer = 0;
function sendPrefs() {
  if (!call || call.mode !== "sfu" || !call.joined) return;
  clearTimeout(prefsTimer);
  prefsTimer = setTimeout(() => {
    if (!call || call.mode !== "sfu") return; // the call ended while this was waiting
    const streams = {};
    document.querySelectorAll("#tiles figure").forEach(f => {
      const w = f.getBoundingClientRect().width * (window.devicePixelRatio || 1);
      const user = f.dataset.user;
      streams[user] = { max: w <= 260 ? "q" : w <= 520 ? "h" : "f", paused: document.hidden || visible.get(user) === false };
    });
    sfu("prefs", { streams, pinned: call.pinned || "", max_kbps: $("saver").checked ? 400 : 0 }).catch(() => {});
  }, 300);
}

const signal = (to, type, data) => rtcdApi("call.signal", { call: call.id, to, type, data }).catch(() => {});
const sfu = (action, body) => rtcdApi("sfu." + action.replace("/", "."), Object.assign({ call: call.id }, body || {}));

// ---- p2p ---------------------------------------------------------------------
function peer(peerUser, ice, stream) {
  const pc = new RTCPeerConnection(pcCfg(ice)); stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.ontrack = e => addTile(e.streams[0]);
  pc.onicecandidate = e => { if (e.candidate) signal(peerUser, "candidate", e.candidate.toJSON()); };
  // A network change: the caller restarts ICE and the callee follows (below).
  pc.oniceconnectionstatechange = () => { const st = pc.iceConnectionState;
    if (st === "failed" || st === "disconnected") setTimeout(() => { if (call && call.pc === pc && pc.iceConnectionState !== "connected" && pc.iceConnectionState !== "completed") p2pRestart(); }, st === "failed" ? 0 : 2000); };
  return pc;
}
async function p2pRestart() {
  if (!call || call.mode !== "p2p" || !call.pc || call.restarting || call.pc.signalingState !== "stable") return;
  call.restarting = true;
  try { const offer = await call.pc.createOffer({ iceRestart: true }); await call.pc.setLocalDescription(offer); await signal(call.peer, "offer", { sdp: offer.sdp, proof: await e2eeSign(offer.sdp) }); }
  catch { /* the next ICE state change tries again */ }
  finally { call.restarting = false; }
}
$("callbtn").onclick = async () => {
  const c = chans.find(x => x.id === cur); const other = (c.members || []).find(m => m !== me); if (!other || call) return;
  const r = await rtcdApi("call.start", { to: [other], kind: "video", mode: "p2p" });
  call = { id: r.call.id, peer: other, mode: "p2p", initiator: me, queue: [], e2ee: r.call.e2ee }; callUI("Calling " + other + "…", false);
  try { if (call.e2ee) await e2eeInit(false); } catch (e) { return e2eeFail(e); }
  const stream = await media(); call.pc = peer(other, r.ice, stream);
  const offer = await call.pc.createOffer(); await call.pc.setLocalDescription(offer);
  await signal(other, "offer", { sdp: offer.sdp, proof: await e2eeSign(offer.sdp) });
};
async function handleSignal(d) {
  const pc = call.pc;
  if (d.type === "offer") {
    // Both sides may restart at once. The callee is "polite": it drops its own
    // offer and answers the caller's.
    if (pc.signalingState !== "stable") { if (call.initiator === me) return; await pc.setLocalDescription({ type: "rollback" }).catch(() => {}); }
    try { await e2eeVerify(d.data.sdp, d.data.proof); } catch (e) { return e2eeFail(e); }   // an unsigned or forged connection is refused
    await pc.setRemoteDescription({ type: "offer", sdp: d.data.sdp }); const a = await pc.createAnswer(); await pc.setLocalDescription(a); await signal(call.peer, "answer", { sdp: a.sdp, proof: await e2eeSign(a.sdp) }); await drain();
  } else if (d.type === "answer") { if (pc.signalingState === "have-local-offer") { try { await e2eeVerify(d.data.sdp, d.data.proof); } catch (e) { return e2eeFail(e); } await pc.setRemoteDescription({ type: "answer", sdp: d.data.sdp }); await drain(); } }
  else if (d.type === "candidate") { if (pc.remoteDescription) await pc.addIceCandidate(d.data).catch(() => {}); else (call.pending = call.pending || []).push(d.data); }
}
async function drain() { for (const c of call.pending || []) await call.pc.addIceCandidate(c).catch(() => {}); call.pending = []; }

// ---- group call through the SFU -----------------------------------------------
$("groupbtn").onclick = async () => {
  const c = chans.find(x => x.id === cur); const others = (c.members || []).filter(m => m !== me); if (!others.length || call) return;
  const r = await rtcdApi("call.start", { to: others, kind: "video", mode: "sfu" });
  call = { id: r.call.id, mode: "sfu", initiator: me, queue: [], ice: r.ice, codec: $("codec").value, e2ee: !!r.call.e2ee }; callUI("Group call: waiting for others…", false);
  await joinSfu();
};
// Three layers of one camera: small, medium and full. The browser lowers or
// drops the top ones by itself if this user's own upload cannot carry them.
// VP8 and H.264 are sent as simulcast (three streams); VP9 is sent as SVC (one
// stream with three spatial layers inside it).
const ENCODINGS = [
  { rid: "q", scaleResolutionDownBy: 4, maxBitrate: 150000 },
  { rid: "h", scaleResolutionDownBy: 2, maxBitrate: 500000 },
  { rid: "f", maxBitrate: 1200000 },
];
const MIME = { vp8: "video/vp8", vp9: "video/vp9", h264: "video/h264" };
// The codec to send comes FIRST, but the others stay in the list. A connection's
// video codecs are fixed by its first negotiation, so a browser that offered
// only its own codec could never be sent anyone else's video; everyone in a
// call has to be able to receive everyone, whatever each of them sends.
function codecPrefs(name) {
  const all = RTCRtpSender.getCapabilities("video").codecs;
  const mine = all.filter(c => c.mimeType.toLowerCase() === MIME[name]);
  const first = name === "h264" ? [...mine.filter(c => (c.sdpFmtpLine || "").includes("packetization-mode=1")), ...mine.filter(c => !(c.sdpFmtpLine || "").includes("packetization-mode=1"))] : mine;
  const rest = all.filter(c => !first.includes(c));
  return [...first, ...rest];
}
async function joinSfu() {
  try { if (call.e2ee) await e2eeInit(true); } catch (e) { return e2eeFail(e); }
  call.stream = call.stream || await media();
  const pc = new RTCPeerConnection(pcCfg(call.ice)); call.pc = pc; call.joined = false; call.cands = []; call.remoteCands = [];
  const audio = call.stream.getAudioTracks()[0], video = call.stream.getVideoTracks()[0];
  // Upstream sections are send-only: the server sends everyone else's video in
  // sections of its own.
  if (audio) e2eeSend(pc.addTransceiver(audio, { direction: "sendonly", streams: [call.stream] }).sender, "audio");
  if (video) {
    // Encrypted frames cannot ride in H.264 (ciphertext can contain its start codes), so an encrypted call sends VP8 or VP9.
    const name = call.e2ee && call.codec === "h264" ? "vp8" : (call.codec || "vp8");
    const svc = name === "vp9";
    let tr;
    try { tr = pc.addTransceiver(video, { direction: "sendonly", streams: [call.stream], sendEncodings: svc ? [{ scalabilityMode: "L3T3_KEY", maxBitrate: 1500000 }] : ENCODINGS }); }
    catch { tr = pc.addTransceiver(video, { direction: "sendonly", streams: [call.stream] }); } // a browser without simulcast or SVC: one layer
    try { const prefs = codecPrefs(name); if (prefs.length) tr.setCodecPreferences(prefs); } catch {}
    e2eeSend(tr.sender, "video");
  }
  pc.ontrack = e => { e2eeRecv(e.receiver, e.track.kind, e.streams[0] && e.streams[0].id); e2eePT(pc); addTile(e.streams[0]); };
  pc.onicecandidate = e => { if (!e.candidate) return; const c = e.candidate.toJSON();
    if (call && call.pc === pc && call.joined) sfu("candidate", c).catch(() => {}); else call.cands.push(c); };
  pc.oniceconnectionstatechange = () => { const st = pc.iceConnectionState; netNote(st);
    if (st === "failed") restartIce("ice failed");
    else if (st === "disconnected") setTimeout(() => { if (call && call.pc === pc && pc.iceConnectionState === "disconnected") restartIce("ice disconnected"); }, 2000); };
  const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
  const ans = await sfu("join", { sdp: offer.sdp, e2ee: !!call.e2ee });
  await pc.setRemoteDescription({ type: "answer", sdp: ans.sdp });
  e2eePT(pc);
  // Only now may the server send its offers: one that overtook this answer
  // would find the connection half-negotiated.
  sfu("ready").catch(() => {});
  call.joined = true; for (const c of call.cands.splice(0)) sfu("candidate", c).catch(() => {});
  for (const c of call.remoteCands.splice(0)) await pc.addIceCandidate(c).catch(() => {});
  callUI("In group call", false); sendPrefs(); statsLoop();
  if (call.e2ee) { await e2eeStart().catch(e => e2eeFail(e)); e2e && (e2e.refresh = setInterval(e2eeRefresh, 2000)); }
}
// The server renegotiates whenever someone joins or leaves, or a video is
// added or removed: answer its offer.
async function sfuOffer(d) {
  const pc = call.pc; if (!pc) return;
  if (pc.signalingState === "have-local-offer") await pc.setLocalDescription({ type: "rollback" }).catch(() => {}); // our restart loses to the server's offer; it is retried
  await pc.setRemoteDescription({ type: "offer", sdp: d.sdp });
  e2eePT(pc);
  const a = await pc.createAnswer(); await pc.setLocalDescription(a); await sfu("answer", { sdp: a.sdp }).catch(() => {});
  for (const c of call.remoteCands.splice(0)) await pc.addIceCandidate(c).catch(() => {});
  sendPrefs();
}
// A candidate can only be added once the description it belongs to is applied.
// During an ICE restart the server's new candidates arrive BEFORE its answer (they
// travel on the same socket and gathering is fast), and the connection still holds
// the old remote description, so adding them now fails: Chrome does not know the
// new ufrag yet. Hold them until the answer is in.
async function addRemoteCandidate(pc, c) {
  try { await pc.addIceCandidate(c); } catch (e) { netNote("a server candidate was refused: " + e.message); }
}
async function flushRemoteCandidates(pc) {
  for (const c of call.remoteCands.splice(0)) await addRemoteCandidate(pc, c);
}
async function sfuCandidate(d) {
  const pc = call.pc;
  if (pc && pc.remoteDescription && pc.signalingState !== "have-local-offer") await addRemoteCandidate(pc, d.candidate);
  else call.remoteCands.push(d.candidate);
}

// ---- surviving a network change ------------------------------------------------
// Switching Wi-Fi to cellular, or a dropped connection, changes this browser's
// address. The call must carry on: first move the existing connection to the
// new path (an ICE restart: nobody else's screen changes), and only if that
// cannot work start over.
function netNote(text) { $("net").textContent = text; }
async function restartIce(reason) {
  if (!call || call.mode !== "sfu" || !call.pc || call.restarting) return;
  call.restarting = true; netNote("reconnecting (" + reason + ")…");
  try {
    for (let attempt = 0; attempt < 6 && call; attempt++) {
      try {
        const pc = call.pc;
        const offer = await pc.createOffer({ iceRestart: true }); await pc.setLocalDescription(offer);
        const ans = await sfu("restart", { sdp: offer.sdp });
        await pc.setRemoteDescription({ type: "answer", sdp: ans.sdp });
        await flushRemoteCandidates(pc); // the server's new candidates, which came first
        netNote("reconnected"); return;
      } catch (e) {
        if (call && call.pc.signalingState === "have-local-offer") { await call.pc.setLocalDescription({ type: "rollback" }).catch(() => {}); await flushRemoteCandidates(call.pc); }
        if (e.code === "not_in_room" || e.status === 410 || e.status === 403) break; // the server forgot us: start over
        await sleep(Math.min(500 * 2 ** attempt, 5000)); // "negotiating": the server's offer is answered meanwhile
      }
    }
    if (call) { netNote("rejoining…"); await rejoinSfu(); }
  } finally { if (call) call.restarting = false; }
}
async function rejoinSfu() {
  call.pc && call.pc.close(); $("tiles").replaceChildren(); visible.clear();
  try { await joinSfu(); netNote("rejoined"); } catch (e) { netNote("could not rejoin: " + e.message); }
}
// A restart is safe at any moment (the server keeps the old path alive until the
// new one is selected), but it is still work: "online" and "the network changed"
// often just mean the machine roamed, so restart only if the call really stopped.
async function mediaFlowing(pc) {
  const bytes = async () => { let n = 0; (await pc.getStats()).forEach(r => { if (r.type === "inbound-rtp") n += r.bytesReceived || 0; }); return n; };
  const before = await bytes(); await sleep(1200);
  return (await bytes()) > before;
}
async function restartIfBroken(reason) {
  if (!call || call.mode !== "sfu" || !call.pc || call.restarting) return;
  const pc = call.pc;
  if (["connected", "completed"].includes(pc.iceConnectionState) && await mediaFlowing(pc).catch(() => false)) { netNote("network changed; the call is still working"); return; }
  return restartIce(reason);
}
window.addEventListener("online", () => restartIfBroken("network back"));
window.addEventListener("offline", () => netNote("offline"));
if (navigator.connection) navigator.connection.addEventListener("change", () => { clearTimeout(call && call.netTimer); if (call) call.netTimer = setTimeout(() => restartIfBroken("network changed"), 500); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && call && call.pc && !["connected", "completed"].includes(call.pc.iceConnectionState)) restartIfBroken("tab visible"); });

// What the server is sending this browser, and at what quality.
async function statsLoop() {
  const id = call && call.id;
  while (call && call.id === id && call.mode === "sfu") {
    try {
      const st = await sfu("stats");
      const parts = st.streams.map(s => s.publisher + " " + (s.paused ? "paused" : s.layer || "…") + (s.layer !== s.target && s.target ? "→" + s.target : ""));
      netNote("↓ " + (st.usage_kbps / 1000).toFixed(1) + " Mbps of " + (st.estimate_kbps ? (st.estimate_kbps / 1000).toFixed(1) : "?") + " · " + parts.join(", "));
      markSpeaker(st.speaker); showRecording(st.recording, "");
      if (st.unavailable && st.unavailable.length) netNote("cannot show video of " + st.unavailable.map(u => u.publisher).join(", ") + " (codec); they are still heard");
      st.streams.forEach(s => { const f = document.getElementById("t-" + s.publisher); const cap = f && f.querySelector("figcaption"); if (cap) cap.textContent = s.publisher + " · " + (s.paused ? "paused" : (s.layer || "…").toUpperCase()); });
    } catch {}
    await sleep(2000);
  }
}

async function callEvent(event, d) {
  if (event === "call.incoming") { if (call) { rtcdApi("call.decline", { call: d.call.id }).catch(() => {}); return; }
    call = { id: d.call.id, peer: d.call.initiator, initiator: d.call.initiator, mode: d.call.mode, ice: d.ice, queue: [], e2ee: !!d.call.e2ee };
    callUI(d.call.initiator + (d.call.mode === "sfu" ? " started a group call…" : " is calling…"), true); }
  else if (event === "sfu.offer" && call && d.call_id === call.id) await sfuOffer(d).catch(() => {});
  else if (event === "sfu.candidate" && call && d.call_id === call.id) await sfuCandidate(d);
  else if (event === "sfu.speaker" && call && d.call_id === call.id) markSpeaker(d.speaker);
  else if (event === "sfu.recording" && call && d.call_id === call.id) showRecording(d.recording, d.by);
  else if (event === "call.signal" && call && d.call_id === call.id) {
    if (!call.pc) { call.queue.push(d); return; } await handleSignal(d).catch(() => {}); }
  else if (event === "call.e2ee" && call && d.call_id === call.id) { if (e2e && e2e.session) await e2e.session.receive(d.from, d.data).catch(() => {}); }
  else if ((event === "call.answered" || event === "call.left") && call && d.call_id === call.id && call.mode === "sfu") { if (event === "call.left" || call.e2ee) e2eeMembership(); }
  else if (event === "call.answered" && call && d.call_id === call.id && call.mode === "p2p") callUI("Connected", false);
  else if (event === "call.ended" || event === "call.declined") { if (call && (d.call_id === call.id)) hangup(false); }
}
$("accept").onclick = async () => {
  const r = await rtcdApi("call.answer", { call: call.id }); call.ice = r.ice;
  if (call.mode === "sfu") { await joinSfu(); return; }
  try { if (call.e2ee) await e2eeInit(false); } catch (e) { return e2eeFail(e); }
  const stream = await media(); call.pc = peer(call.peer, r.ice, stream);
  callUI("Connected", false); for (const d of call.queue.splice(0)) await handleSignal(d);
};
$("decline").onclick = async () => { await rtcdApi("call.decline", { call: call.id }).catch(() => {}); hangup(false); };
$("hangup").onclick = () => hangup(true);
function hangup(tell) {
  if (!call) return; if (tell) { if (call.mode === "sfu") sfu("leave").catch(() => {}); rtcdApi("call.end", { call: call.id }).catch(() => {}); }
  call.pc && call.pc.close(); clearTimeout(call.netTimer); showRecording(false); $("rec").classList.add("hidden");
  if (e2e && e2e.refresh) clearInterval(e2e.refresh); e2eeStop();
  [call.stream, $("local").srcObject].forEach(s => s && s.getTracks().forEach(t => t.stop())); $("local").srcObject = null;
  $("tiles").replaceChildren(); visible.clear(); call = null; callUI(null);
}
</script>
</body>
