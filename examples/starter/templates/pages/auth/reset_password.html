@extends("layouts/auth.html")

@define("content") {
  <div class="auth-header">
    <h1>Choose a new password</h1>
    <p>Paste the token from your reset link</p>
  </div>

  <form method="POST" action="/reset-password">
    <div class="form-group">
      <label class="form-label" for="token">Reset token</label>
      <input type="text" id="token" name="token" class="form-input" placeholder="the token from the delivery" value="${token}" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password" class="form-input" placeholder="At least 8 characters" required minlength="8">
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Set new password</button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-dim);">
    <a href="/login">Back to sign in</a>
  </div>
}
