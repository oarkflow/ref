<header class="site-header">
  <div class="nav-container">
    <a href="/dashboard" class="brand">
      <span class="brand-mark">R/</span>
      <span class="brand-name">${appName}</span>
      <span class="brand-tag">v${appVersion}</span>
    </a>

    <nav class="nav">
      <!--
        NOTE: no directive keywords (the at-sign forms) written out
        literally inside this comment — an oarkflow/spl parser quirk scans
        comment text for those too, misreading one as real syntax and
        corrupting everything parsed after it.

        "user.email != ''", not a bare "user": a bare-identifier condition
        paired with an else clause is read by this engine as a
        client-hydration signal, which has shown real bugs in this
        codebase with no hydration runtime loaded to back it up (see
        resources/templates/components/todos/field.html and
        resources/templates/pages/todos/show.html for two of them). A
        comparison expression avoids that code path entirely.
      -->
      @if(user.email != "") {
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/todos" class="nav-link">Todos</a>
        @if(user.roles == "admin") {
          <a href="/dashboard/admin" class="nav-link">Admin</a>
        }
        <form method="POST" action="/logout" class="nav-form">
          <button type="submit" class="btn btn-secondary btn-sm">Sign out</button>
        </form>
      } @else {
        <a href="/login" class="nav-link">Sign in</a>
        <a href="/register" class="btn btn-primary btn-sm">Register</a>
      }
    </nav>
  </div>
</header>
