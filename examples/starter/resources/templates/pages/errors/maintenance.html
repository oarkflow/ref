@extends("layouts/auth.html")

@define("content") {
  <div class="auth-header">
    <span class="status-code">Maintenance</span>
    <h1>Down for maintenance</h1>
    <p>${message}</p>
  </div>

  <div class="panel">
    <div class="kv">
      <div class="kv-row">
        <span class="kv-key">Since</span>
        <span class="kv-value font-mono">${since}</span>
      </div>
      @if(retryAfterSeconds) {
        <div class="kv-row">
          <span class="kv-key">Expected back in</span>
          <span class="kv-value font-mono">${retryAfterSeconds}s</span>
        </div>
      }
    </div>
  </div>

  <div class="auth-foot">
    /health, /livez and /readyz still work — this page is everything else.
  </div>
}
