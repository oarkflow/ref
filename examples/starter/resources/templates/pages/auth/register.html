@extends("layouts/auth.html")

@define("content") {
  <div class="auth-header">
    <h1>Create your account</h1>
    <p>It takes less than a minute</p>
  </div>

  <form method="POST" action="/register">
    <div class="form-field">
      <label class="form-label" for="name">Name</label>
      <input type="text" id="name" name="name" class="form-control" placeholder="Your name" value="${name}" required autofocus>
    </div>

    <div class="form-field">
      <label class="form-label" for="email">Email address</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" value="${email}" required>
    </div>

    <div class="form-field">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="At least 8 characters" required minlength="8">
    </div>

    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>

  <div class="auth-foot">
    Already have an account? <a href="/login">Sign in</a>
  </div>
}
