@extends("layouts/auth.html")

@define("content") {
  <div class="auth-header">
    <h1>Reset your password</h1>
    <p>We'll send a reset link if that address has an account</p>
  </div>

  <form method="POST" action="/forgot-password">
    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autofocus>
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Send reset link</button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-dim);">
    <a href="/login">Back to sign in</a>
  </div>
}
