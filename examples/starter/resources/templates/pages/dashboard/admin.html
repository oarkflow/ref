@extends("layouts/base.html")

@define("content") {
  <div class="page-head">
    <h1 class="page-title">Admin portal</h1>
    <p class="page-subtitle">
      <code>route "web.admin"</code> requires <code>roles ["admin"]</code>; a signed-in "user"
      gets HTTP 403 here, before <code>dashboard.admin</code> ever runs.
    </p>
  </div>

  <div class="panel">
    <span class="panel-label">Directory</span>
    <h3 class="panel-title">Everyone with an account</h3>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Name</th>
            <th>Roles</th>
          </tr>
        </thead>
        <tbody>
          @for(u in users) {
            <tr>
              <td class="font-mono">${u.email}</td>
              <td>${u.name}</td>
              <td><span class="badge badge-${u.roles}">${u.roles}</span></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
}
